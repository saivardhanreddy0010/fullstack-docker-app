<!DOCTYPE html>
<html>

<head>
    <title>Full Stack Docker Application</title>

    <style>

        body {
            font-family: Arial;
            background: #f0f2f5;
            text-align: center;
            padding: 50px;
        }

        .container {
            background: white;
            padding: 30px;
            width: 350px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input, textarea {
            width: 90%;
            padding: 10px;
            margin: 10px;
        }

        button {
            background: #007bff;
            color: white;
            padding: 12px 25px;
            border: none;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h2>Full Stack Application</h2>

        <form id="myForm">

            <input type="text"
                   id="name"
                   placeholder="Enter Name"
                   required>

            <input type="email"
                   id="email"
                   placeholder="Enter Email"
                   required>

            <textarea id="message"
                      placeholder="Enter Message"
                      required></textarea>

            <button type="submit">Submit</button>

        </form>

        <div id="result"></div>

    </div>

    <script>

        document.getElementById("myForm").addEventListener("submit", async function(event) {

            event.preventDefault();

            const data = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                message: document.getElementById("message").value
            };

            try {

                const response = await fetch("/submit", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                document.getElementById("result").innerHTML =
                    `<h3>${result.message}</h3>`;

            } catch (error) {

                document.getElementById("result").innerHTML =
                    "<h3>Something went wrong!</h3>";

            }

        });

    </script>

</body>

</html>
